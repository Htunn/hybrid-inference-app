# Prometheus configuration for hybrid-inference-app
# Collects metrics from the FastAPI backend

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "hybrid-inference-monitor"

scrape_configs:
  # Backend API metrics
  - job_name: "backend"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: "/metrics"
    scrape_interval: 10s
    scrape_timeout: 5s

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

# Alerting rules (optional)
# rule_files:
#   - 'alerts.yml'
