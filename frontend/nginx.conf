# Rate-limiting zone: 20 requests/minute per IP, 10 MB shared memory
limit_req_zone $binary_remote_addr zone=chat_zone:10m rate=20r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # -----------------------------------------------------------------------
    # Security headers
    # -----------------------------------------------------------------------
    add_header X-Frame-Options           "DENY"            always;
    add_header X-Content-Type-Options    "nosniff"         always;
    add_header X-XSS-Protection          "1; mode=block"   always;
    add_header Referrer-Policy           "strict-origin"   always;
    add_header Permissions-Policy        "geolocation=()"  always;
    # Content Security Policy — tighten allowed sources for production
    # 'unsafe-inline' is required for Vite-bundled React; remove if you adopt a nonce strategy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none';" always;

    # -----------------------------------------------------------------------
    # Proxy /api/* → FastAPI backend
    # -----------------------------------------------------------------------
    location /api/ {
        # Rate limiting: allow burst of 5, then queue
        limit_req zone=chat_zone burst=5 nodelay;

        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE / streaming — critical: disable buffering so tokens flow live
        proxy_buffering            off;
        proxy_cache                off;
        proxy_read_timeout         180s;
        proxy_connect_timeout      10s;
        chunked_transfer_encoding  on;
    }

    # -----------------------------------------------------------------------
    # SPA fallback — all unmatched paths return index.html
    # -----------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -----------------------------------------------------------------------
    # Compression
    # -----------------------------------------------------------------------
    gzip            on;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        font/woff2;
    gzip_min_length 1024;
}
